name: validate exercises

# Jay 2026-11-14: an item asked for "to go" and marked the student wrong.
# Jay 2026-11-16: word-order chips were white on white.
# Jay 2026-11-17: a question asked for 8 words and only accepted 9.
# Jay 2026-11-18: practice cards still advertised the numbers from when their
#   cards were held, and numbers on cards did not match the page.
# Every push that touches data/ runs all of these, so a broken item shows a red X
# here before it can reach a student.
on:
  push:
    paths:
      - "data/**"
      - "scripts/validate-exercises.py"
      - "scripts/lint-style-contrast.py"
      - "scripts/check-word-counts.py"
      - "scripts/check-catalog-counts.py"
      - "scripts/check-order-answers.py"
      - "scripts/book-labels.py"
      - "assets/**"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # every stored answer must sit in its own blank; no repeated label, no
      # number used twice, no letter that is not the section's letter
      - run: python3 scripts/validate-exercises.py
      # order and word-bank buttons must be readable
      - run: python3 scripts/lint-style-contrast.py
      # a stated word count must be reachable by an accepted answer
      - run: python3 scripts/check-word-counts.py
      # an order card's own words must read in the order its explanation gives
      - run: python3 scripts/check-order-answers.py
      # a practice card must state what the practice really holds
      - run: python3 scripts/check-catalog-counts.py
      # a number that does not come from the page fails the push
      - run: python3 scripts/book-labels.py --check
